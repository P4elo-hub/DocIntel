services:
  app:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./app:/app/app:ro
      - ./feature-methodology-project:/app/feature-methodology-project:ro
    environment:
      LOG_LEVEL: DEBUG
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-0}
