services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./app:/app/app:ro
      - ./bot:/app/bot:ro
      - ./feature-methodology-project:/app/feature-methodology-project:ro
      - ./scripts:/app/scripts:ro
      - ./eval:/app/eval
      - ./var/chats:/app/var/chats
      - ./data:/app/data
    environment:
      LOG_LEVEL: DEBUG
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-0}

  # Монтируем исходники бота, чтобы правки применялись рестартом контейнера,
  # без полной пересборки образа.
  bot:
    volumes:
      - ./bot:/app/bot:ro
      - ./app:/app/app:ro

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
