services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-service:v1
    container_name: llm-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
      SECURITY_ENABLED: ${SECURITY_ENABLED:-true}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-30}
      CHAT_REPOSITORY: ${CHAT_REPOSITORY:-postgres}
      CHAT_STORAGE_DIR: /app/var/chats
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/llm_service
      BOT_URL: http://bot:9000
      QDRANT_URL: http://qdrant:6333
    volumes:
      - chat_data:/app/var/chats
      # RAG-корпус с хоста (не в образе — см. .dockerignore); rw для upload/reindex.
      - ./data:/app/data
      # Кэш HuggingFace: веса reranker-модели (~2.2 ГБ) переживают пересборку образа.
      - hf_cache:/home/appuser/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      phoenix:
        condition: service_started
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-service:v1
    container_name: chat-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKEND_URL: http://app:8000
    expose:
      - "9000"
    depends_on:
      app:
        condition: service_healthy
    command: ["python", "-m", "bot"]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-service:v1
    container_name: llm-migrate
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/llm_service
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: llm-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llm_service
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d llm_service"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:4
    container_name: llm-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  redis:
    image: redis:7.4-alpine
    container_name: llm-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: llm-phoenix
    restart: unless-stopped
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix-data:/data

  qdrant:
    image: qdrant/qdrant:v1.14.0
    container_name: llm-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__LOG_LEVEL: INFO
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  redis_data:
  phoenix-data:
  postgres_data:
  chat_data:
  qdrant_storage:
  hf_cache:
