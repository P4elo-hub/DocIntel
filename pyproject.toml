[project]
name = "llm-service"
version = "0.1.0"
description = "FastAPI-сервис для LLM (Б3.4 курса 'ИИ-разработчик')"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.110",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "uvicorn[standard]>=0.29",
    "openai>=1.40",
    "redis>=5.0",
    "tenacity>=8.2",
    "jinja2>=3.1",
    "structlog>=26.1.0",
    "arize-phoenix>=17.9.0",
    "openinference-instrumentation-openai>=0.1.52",
    "aiofiles>=24.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "tiktoken>=0.7",
    "aiogram>=3.10",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "telegramify-markdown>=0.5",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "ruff>=0.4",
    "pyyaml>=6.0.3",
    "testcontainers[postgres]>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: изолированные unit-тесты (без HTTP и сети)",
    "integration: API/component-тесты через TestClient с моками",
]
