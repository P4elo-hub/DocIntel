# Устарело: Postgres теперь в основном compose.yaml.
# Оставлено для обратной совместимости с pytest/testcontainers.
services:
  postgres:
    image: postgres:16-alpine
    container_name: llm-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llm_service
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
